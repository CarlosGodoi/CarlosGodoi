<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 160" width="100%" height="160">
<!-- Estilos CSS e Animações Nativas -->
<style>
  .bg { fill: #040906; }
  .border-box { fill: #040906; stroke: #005522; stroke-width: 1.5; rx: 6px; }
  .border-box-inner { fill: #020503; stroke: #003311; stroke-width: 1; rx: 4px; }
  .text-matrix { font-family: 'Courier New', Consolas, Monaco, monospace; fill: #00ff66; }
  .text-dim { fill: #008833; font-family: 'Courier New', Consolas, Monaco, monospace; }
  .text-bright { fill: #66ff99; font-weight: bold; font-family: 'Courier New', Consolas, Monaco, monospace; }

  /* Animação do Cursor e Status */
  @keyframes blink {
    0%, 45% { opacity: 1; }
    50%, 100% { opacity: 0; }
  }
  .cursor { animation: blink 0.9s infinite; fill: #00ff66; }
  .status-pulse { animation: blink 1.8s infinite; }

  /* Animação da Chuva Matrix */
  @keyframes matrixDrop {
    0% { transform: translateY(-100px); opacity: 0; }
    20% { opacity: 0.6; }
    80% { opacity: 0.6; }
    100% { transform: translateY(450px); opacity: 0; }
  }
  .col-1 { animation: matrixDrop 5s linear infinite; animation-delay: 0s; }
  .col-2 { animation: matrixDrop 7s linear infinite; animation-delay: 1.5s; }
  .col-3 { animation: matrixDrop 6s linear infinite; animation-delay: 0.7s; }

  /* Barra de Progresso Animada */
  @keyframes fillProgress {
    0% { width: 0px; }
    50% { width: 560px; }
    90% { width: 560px; }
    100% { width: 560px; }
  }
  .progress-bar-fill {
    animation: fillProgress 6s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    fill: #00ff66;
  }
</style>


<text x="0" y="48" class="text-matrix" font-size="11" font-weight="bold" letter-spacing="1">
  FRONT-END DEVELOPER  |  FULLSTACK  |  3+ YEARS
</text>

<text x="0" y="72" class="text-dim" font-size="11">
  Desenvolvedor apaixonado por tecnologia, com foco em criar experiências
</text>
<text x="0" y="88" class="text-dim" font-size="11">
  digitais incríveis. Especializado em Front-End com React, TypeScript
</text>
<text x="0" y="104" class="text-dim" font-size="11">
  e Next.js, e com sólida experiência Fullstack (Node.js, PostgreSQL).
</text>


<text x="12" y="46" class="text-dim" font-size="11">USER: <tspan class="text-matrix">carlosgodoi</tspan></text>
<text x="12" y="66" class="text-dim" font-size="11">ROLE: <tspan class="text-matrix">Front-End Dev</tspan></text>
<text x="12" y="86" class="text-dim" font-size="11">LOC : <tspan class="text-matrix">Brazil 🇧🇷</tspan></text>

<g class="text-matrix" font-size="9" opacity="0.8">
  <text x="240" y="48"> .---. </text>
  <text x="233" y="60"> /     \ </text>
  <text x="230" y="72">| () () | MATRIX</text>
  <text x="233" y="84"> \  ^  /  ONLINE</text>
</g>


<g transform="translate(12, 64)">
  <rect x="0" y="0" width="856" height="10" fill="#040906" stroke="#005522" rx="2" />
  <rect class="progress-bar-fill" x="1" y="1" width="0" height="8" rx="1" />
</g>


<!-- Projeto 2 -->
<g transform="translate(450, 0)">
  <rect class="border-box-inner" x="0" y="0" width="430" height="80" />
  <text x="12" y="22" class="text-bright" font-size="13">💻 Portfólio Pessoal</text>
  <text x="12" y="42" class="text-dim" font-size="11">Portfólio moderno apresentando experiência e projetos.</text>
  <text x="12" y="62" class="text-matrix" font-size="10">[Next.js] [Tailwind CSS] [TypeScript]</text>
</g>
</svg>
