<svg>
<!-- Estilos CSS e Animações Nativas -->
<style>
  /* Estilos base */
  .bg { fill: #040906; }
  .border-box { fill: #040906; stroke: #005522; stroke-width: 1.5; rx: 6px; }
  .border-box-inner { fill: #020503; stroke: #003311; stroke-width: 1; rx: 4px; }
  .text-matrix { font-family: 'Courier New', Monaco, Consolas, monospace; fill: #00ff66; }
  .text-dim { fill: #008833; font-family: 'Courier New', Monaco, Consolas, monospace; }
  .text-bright { fill: #66ff99; font-weight: bold; font-family: 'Courier New', Monaco, Consolas, monospace; }

  /* Animações */
  @keyframes blink {
    0%, 45% { opacity: 1; }
    50%, 100% { opacity: 0; }
  }
  .cursor { animation: blink 0.9s infinite; fill: #00ff66; }
  .status-pulse { animation: blink 1.8s infinite; }

  @keyframes matrixDrop {
    0% { transform: translateY(-120px); opacity: 0; }
    15% { opacity: 0.4; }
    85% { opacity: 0.4; }
    100% { transform: translateY(500px); opacity: 0; }
  }

  .col-1 { animation: matrixDrop 5s linear infinite; animation-delay: 0s; }
  .col-2 { animation: matrixDrop 7s linear infinite; animation-delay: 1.5s; }
  .col-3 { animation: matrixDrop 6s linear infinite; animation-delay: 0.7s; }
  .col-4 { animation: matrixDrop 8s linear infinite; animation-delay: 2.2s; }
  .col-5 { animation: matrixDrop 5.5s linear infinite; animation-delay: 3s; }

  /* Barra de Progresso Animada */
  @keyframes fillProgress {
    0% { width: 0px; }
    50% { width: 840px; }
    90% { width: 840px; }
    100% { width: 840px; }
  }
  .progress-bar-fill {
    animation: fillProgress 6s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    fill: #00ff66;
  }
</style>


<text x="0" y="68" class="text-dim" font-size="11">
  Desenvolvedor apaixonado por tecnologia, com foco em criar experiências
</text>
<text x="0" y="85" class="text-dim" font-size="11">
  digitais incríveis. Especializado em Front-End com React, TypeScript
</text>
<text x="0" y="102" class="text-dim" font-size="11">
  e Next.js, e com sólida experiência Fullstack (Node.js, PostgreSQL).
</text>

<!-- Botões / Badges -->
<g transform="translate(0, 120)">
  <rect x="0" y="0" width="100" height="24" class="border-box-inner" />
  <text x="14" y="16" class="text-matrix" font-size="10">🔗 LinkedIn</text>

  <rect x="110" y="0" width="100" height="24" class="border-box-inner" />
  <text x="122" y="16" class="text-matrix" font-size="10">🌐 Portfólio</text>

  <rect x="220" y="0" width="90" height="24" class="border-box-inner" />
  <text x="232" y="16" class="text-matrix" font-size="10">✉️ Email</text>
</g>


<!-- Arte ASCII Avatar -->
<g class="text-matrix" font-size="8" opacity="0.85" transform="translate(220, 20)">
  <text x="20" y="10"> .---. </text>
  <text x="13" y="22"> /     \   MATRIX</text>
  <text x="10" y="34">| () () |  PROGRAMMER</text>
  <text x="13" y="46"> \  ^  /   ONLINE</text>
  <text x="20" y="58">  ||||| </text>
</g>
<text x="15" y="130" class="text-dim" font-size="10" italic="true">"Grandes resultados vêm de pequenos códigos."</text>


<text x="15" y="25" class="text-matrix" font-size="11">[&gt;] Inicializando ambiente de desenvolvimento... <tspan class="text-bright">OK</tspan></text>
<text x="15" y="45" class="text-matrix" font-size="11">[&gt;] Carregando React, Next.js, TypeScript e Node.js... <tspan class="text-bright">OK</tspan></text>
<text x="15" y="65" class="text-matrix" font-size="11">[&gt;] Conectando ao banco de dados PostgreSQL... <tspan class="text-bright">OK</tspan></text>

<!-- Barra de Progresso Animada -->
<g transform="translate(15, 80)">
  <rect x="0" y="0" width="840" height="16" fill="#040906" stroke="#005522" rx="3" />
  <rect class="progress-bar-fill" x="2" y="2" width="0" height="12" rx="2" />
</g>


<!-- Projeto 2: Portfólio Pessoal -->
<g transform="translate(445, 0)">
  <rect class="border-box-inner" x="0" y="0" width="425" height="95" />
  <text x="15" y="25" class="text-bright" font-size="13">💻 Portfólio Pessoal</text>
  <text x="15" y="48" class="text-dim" font-size="11">Portfólio moderno apresentando experiência e projetos.</text>
  <text x="15" y="73" class="text-matrix" font-size="10">[Next.js] [Tailwind CSS] [TypeScript]</text>
</g>

</svg>
